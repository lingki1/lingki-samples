# 格式规则表 —— 把《格式要求.docx》的 8 条写成程序能执行的数值。
# 学校改了要求，改这里；改完请让 Claude 跑一遍检查。
#
# 写法：等号左边的名字和方括号里的名字都要带英文引号，不要改动；只改等号右边。
# 字号可以写："二号" "小二" "三号" "小三" "四号" "小四" "五号" "小五"，或者直接写磅值（数字，不带引号）。
# 对齐可以写："居中" "靠左" "靠右" "两端对齐"。

["页面"]            # 第一条：A4，竖向
"纸张宽_厘米" = 21.0
"纸张高_厘米" = 29.7
"上下边距_厘米" = 2.54
"左右边距_厘米" = 3.18

["题目"]            # 第二条
"字体" = "黑体"
"字号" = "二号"
"对齐" = "居中"

["姓名行"]          # 第三条
"字体" = "楷体"
"字号" = "小四"
"对齐" = "居中"
"班级" = "高二（3）班"
"间隔" = "  "       # 班级、姓名、学号之间：两个半角空格

["小标题"]          # 第四条
"字体" = "黑体"
"字号" = "四号"
"对齐" = "靠左"
# 以下两项是老师 2026-10-11 追加的要求，学校的 8 条里没有
"统一编号" = true   # 把「1.」「（一）」或没编号的，统一成「一、」「二、」「三、」；写 false 就不动编号
"不编号的小标题" = ["参考资料", "参考文献", "致谢", "附录"]

["正文"]            # 第五条
"中文字体" = "宋体"
"西文字体" = "Times New Roman"
"字号" = "小四"
"对齐" = "两端对齐"
"首行缩进_字" = 2
"行距_倍" = 1.5     # 题目、姓名行、小标题、表格里的字也用这个行距

["表格"]            # 第六条：表格整体居中；里面的字用正文的字体和字号
"文字对齐" = "居中"

["页码"]            # 第七条：页面底端
"字体" = "Times New Roman"
"字号" = "小五"
"对齐" = "居中"
